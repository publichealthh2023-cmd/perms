<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://xbivmhkqxmrkpjxfvemc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_jTXNyxYwDMmJDUzg46rcdA_rySASiuE";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   KEYS
========================================================= */

const CONFIG_KEY =
    "phrmsRoundsConfig";

const RECORDS_KEY =
    "phrmsMedicalWasteRounds";

const EMPLOYEE_SIGNATURES_KEY =
    "phrmsEmployeeSignatures";


/* =========================================================
   STATE
========================================================= */

let currentItems = [];

let employees = [];

let roundsConfig = {};


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        setCurrentDateTime();

        await Promise.all([
            loadEmployees(),
            loadRoundsConfig()
        ]);

        loadMedicalWasteItems();

    }
);


/* =========================================================
   LOCAL CONFIG BACKUP
========================================================= */

function getLocalRoundsConfig(){

    try{

        const raw =
            localStorage.getItem(
                CONFIG_KEY
            );

        if(!raw){

            return {};

        }

        const config =
            JSON.parse(raw);

        return (
            config &&
            typeof config === "object"
        )
            ? config
            : {};

    }
    catch(error){

        console.error(
            "Local rounds config error:",
            error
        );

        return {};

    }

}


/* =========================================================
   SAVE LOCAL CONFIG BACKUP
========================================================= */

function saveLocalRoundsConfig(config){

    try{

        localStorage.setItem(
            CONFIG_KEY,
            JSON.stringify(config)
        );

    }
    catch(error){

        console.error(
            "Rounds config backup error:",
            error
        );

    }

}


/* =========================================================
   LOAD CENTRAL CONFIG
========================================================= */

async function loadRoundsConfig(){

    const localConfig =
        getLocalRoundsConfig();

    try{

        const {
            data,
            error
        } = await supabaseClient
            .from("rounds_config")
            .select(
                "round_type, config_data, updated_at"
            );


        if(error){

            console.error(
                "Supabase rounds config error:",
                error
            );

            roundsConfig =
                localConfig;

            return false;

        }


        if(
            !data ||
            data.length === 0
        ){

            roundsConfig =
                localConfig;

            return false;

        }


        const centralConfig = {};


        data.forEach(
            function(row){

                if(
                    row.round_type &&
                    row.config_data &&
                    typeof row.config_data === "object"
                ){

                    centralConfig[
                        row.round_type
                    ] =
                        row.config_data;

                }

            }
        );


        roundsConfig =
            centralConfig;


        saveLocalRoundsConfig(
            roundsConfig
        );


        console.log(
            "✅ Medical waste configuration loaded from Supabase."
        );


        return true;

    }
    catch(error){

        console.error(
            "Rounds configuration connection error:",
            error
        );


        roundsConfig =
            localConfig;


        return false;

    }

}


/* =========================================================
   GET CONFIG
========================================================= */

function getRoundsConfig(){

    return (
        roundsConfig &&
        typeof roundsConfig === "object"
    )
        ? roundsConfig
        : {};

}


/* =========================================================
   LOCAL EMPLOYEES
========================================================= */

function getEmployeeSignatures(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(
                    EMPLOYEE_SIGNATURES_KEY
                )
            ) || [];


        return Array.isArray(data)
            ? data
            : [];

    }
    catch(error){

        return [];

    }

}


/* =========================================================
   LOAD EMPLOYEES
========================================================= */

async function loadEmployees(){

    const localEmployees =
        getEmployeeSignatures();


    try{

        const {
            data,
            error
        } = await supabaseClient
            .from("employees")
            .select(
                "employee_name, employee_number, signature_data"
            )
            .order(
                "employee_name",
                {
                    ascending:true
                }
            );


        if(error){

            console.error(
                "Supabase employees error:",
                error
            );


            employees =
                localEmployees;

        }
        else{

            employees =
                (data || [])
                .map(
                    function(item){

                        return {

                            employeeName:
                                item.employee_name || "",

                            employeeNumber:
                                item.employee_number || "",

                            signature:
                                item.signature_data || ""

                        };

                    }
                );


            if(!employees.length){

                employees =
                    localEmployees;

            }


            try{

                localStorage.setItem(
                    EMPLOYEE_SIGNATURES_KEY,
                    JSON.stringify(
                        employees
                    )
                );

            }
            catch(error){

                console.error(
                    "Employee cache error:",
                    error
                );

            }

        }

    }
    catch(error){

        console.error(
            "Employee connection error:",
            error
        );


        employees =
            localEmployees;

    }


    renderEmployeeOptions();

}


/* =========================================================
   EMPLOYEE OPTIONS
========================================================= */

function renderEmployeeOptions(){

    const select =
        document.getElementById(
            "employeeName"
        );


    select.innerHTML = `

        <option value="">
            اختر منفذ الجولة
        </option>

    `;


    employees.forEach(
        function(employee){

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                employee.employeeNumber ||
                employee.employeeName;


            option.textContent =
                employee.employeeName;


            select.appendChild(
                option
            );

        }
    );


    if(!employees.length){

        const option =
            document.createElement(
                "option"
            );


        option.value = "";


        option.textContent =
            "لا يوجد موظفون مسجلون";


        select.appendChild(
            option
        );

    }

}


/* =========================================================
   EMPLOYEE CHANGE
========================================================= */

function employeeChanged(){

    const value =
        document.getElementById(
            "employeeName"
        ).value;


    const numberInput =
        document.getElementById(
            "employeeNumber"
        );


    const status =
        document.getElementById(
            "employeeSignatureStatus"
        );


    const message =
        document.getElementById(
            "signatureEmployeeMessage"
        );


    const preview =
        document.getElementById(
            "employeeSignaturePreview"
        );


    numberInput.value = "";

    preview.innerHTML = "";

    status.classList.remove(
        "active"
    );


    if(!value){

        return;

    }


    const employee =
        employees.find(
            function(item){

                return (
                    String(
                        item.employeeNumber ||
                        item.employeeName
                    ) ===
                    String(value)
                );

            }
        );


    if(!employee){

        return;

    }


    numberInput.value =
        employee.employeeNumber || "";


    status.classList.add(
        "active"
    );


    if(employee.signature){

        message.className =
            "signature-ok";


        message.textContent =
            "✓ سيتم التوقيع إلكترونياً بعد إرسال الجولة.";


        preview.innerHTML = `

            <img
                src="${employee.signature}"
                alt="توقيع الموظف">

        `;

    }
    else{

        message.className =
            "signature-missing";


        message.textContent =
            "⚠ لا يوجد توقيع إلكتروني مسجل لهذا الموظف.";

    }

}


/* =========================================================
   DATE TIME
========================================================= */

function setCurrentDateTime(){

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth()+1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    const hours =
        String(
            now.getHours()
        ).padStart(
            2,
            "0"
        );


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "inspectionDate"
    ).value =
        `${year}-${month}-${day}`;


    document.getElementById(
        "inspectionTime"
    ).value =
        `${hours}:${minutes}`;

}


/* =========================================================
   LOAD MEDICAL WASTE ITEMS
========================================================= */

function loadMedicalWasteItems(){

    const config =
        getRoundsConfig();


    const data =
        config.medicalWaste;


    const message =
        document.getElementById(
            "categoryMessage"
        );


    const container =
        document.getElementById(
            "inspectionItems"
        );


    currentItems = [];

    container.innerHTML = "";


    if(
        !data ||
        !Array.isArray(
            data.sections
        )
    ){

        message.style.display =
            "block";


        message.innerHTML = `

            ⚠️ تعذر تحميل بنود جولة النفايات الطبية.

            <br><br>

            تأكد من الاتصال بالإنترنت
            ثم أعد فتح الصفحة.

        `;


        updateResults();

        return;

    }


    data.sections.forEach(
        function(section){

            if(
                section.active === false
            ){

                return;

            }


            const items =
                Array.isArray(
                    section.items
                )
                    ? section.items
                    : [];


            items.forEach(
                function(item){

                    if(
                        item.active === false
                    ){

                        return;

                    }


                    currentItems.push({

                        id:
                            item.id,

                        sectionId:
                            section.id,

                        sectionName:
                            section.name,

                        text:
                            item.text,

                        status:
                            "",

                        note:
                            ""

                    });

                }
            );

        }
    );


    if(!currentItems.length){

        message.style.display =
            "block";


        message.textContent =
            "لا توجد بنود مفعلة لهذه الجولة حالياً.";


        updateResults();

        return;

    }


    message.style.display =
        "none";


    renderItems();

}


/* =========================================================
   RENDER ITEMS
========================================================= */

function renderItems(){

    const container =
        document.getElementById(
            "inspectionItems"
        );


    const groups = [];


    currentItems.forEach(
        function(
            item,
            index
        ){

            let group =
                groups.find(
                    function(current){

                        return (
                            current.sectionId ===
                            item.sectionId
                        );

                    }
                );


            if(!group){

                group = {

                    sectionId:
                        item.sectionId,

                    sectionName:
                        item.sectionName,

                    items:
                        []

                };


                groups.push(
                    group
                );

            }


            group.items.push({

                item:
                    item,

                index:
                    index

            });

        }
    );


    container.innerHTML =
        groups
        .map(
            function(group){

                return `

                <section class="dynamic-section">

                    <div class="dynamic-section-title">

                        ${escapeHtml(
                            group.sectionName
                        )}

                    </div>

                    <div class="dynamic-section-items">

                        ${
                            group.items
                            .map(
                                function(entry){

                                    return renderItem(
                                        entry.item,
                                        entry.index
                                    );

                                }
                            )
                            .join("")
                        }

                    </div>

                </section>

                `;

            }
        )
        .join("");


    updateResults();

}


/* =========================================================
   RENDER ITEM
========================================================= */

function renderItem(
    item,
    index
){

    return `

    <div class="inspection-item">

        <div class="item-head">

            <div class="item-number-badge">
                ${index + 1}
            </div>

            <div class="item-text">
                ${escapeHtml(
                    item.text
                )}
            </div>

        </div>


        <div class="item-status">

            <label
                class="status-button yes"
                id="status-${index}-yes">

                <input
                    type="radio"
                    name="item-${index}"
                    value="yes"
                    onchange="setItemStatus(${index},'yes')">

                ✓ يطبق

            </label>


            <label
                class="status-button no"
                id="status-${index}-no">

                <input
                    type="radio"
                    name="item-${index}"
                    value="no"
                    onchange="setItemStatus(${index},'no')">

                ✕ لا يطبق

            </label>


            <label
                class="status-button na"
                id="status-${index}-na">

                <input
                    type="radio"
                    name="item-${index}"
                    value="na"
                    onchange="setItemStatus(${index},'na')">

                — لا ينطبق

            </label>

        </div>


        <div
            id="note-${index}"
            class="item-note">

            <textarea
                placeholder="اكتب الملاحظة..."
                oninput="setItemNote(${index},this.value)"></textarea>

        </div>

    </div>

    `;

}


/* =========================================================
   STATUS
========================================================= */

function setItemStatus(
    index,
    status
){

    if(!currentItems[index]){

        return;

    }


    currentItems[index].status =
        status;


    [
        "yes",
        "no",
        "na"
    ]
    .forEach(
        function(value){

            const element =
                document.getElementById(
                    `status-${index}-${value}`
                );


            if(element){

                element.classList.toggle(
                    "selected",
                    value === status
                );

            }

        }
    );


    const note =
        document.getElementById(
            `note-${index}`
        );


    if(note){

        if(
            status === "no"
        ){

            note.classList.add(
                "active"
            );

        }
        else{

            note.classList.remove(
                "active"
            );


            currentItems[index].note =
                "";


            const textarea =
                note.querySelector(
                    "textarea"
                );


            if(textarea){

                textarea.value = "";

            }

        }

    }


    updateResults();

}


/* =========================================================
   NOTE
========================================================= */

function setItemNote(
    index,
    value
){

    if(!currentItems[index]){

        return;

    }


    currentItems[index].note =
        value.trim();

}


/* =========================================================
   RESULTS
========================================================= */

function updateResults(){

    const total =
        currentItems.length;


    const answered =
        currentItems.filter(
            function(item){

                return !!item.status;

            }
        ).length;


    const yes =
        currentItems.filter(
            function(item){

                return (
                    item.status === "yes"
                );

            }
        ).length;


    const no =
        currentItems.filter(
            function(item){

                return (
                    item.status === "no"
                );

            }
        ).length;


    const na =
        currentItems.filter(
            function(item){

                return (
                    item.status === "na"
                );

            }
        ).length;


    const applicable =
        yes + no;


    const compliance =
        applicable
            ? Math.round(
                yes /
                applicable *
                100
            )
            : 0;


    const completion =
        total
            ? Math.round(
                answered /
                total *
                100
            )
            : 0;


    document.getElementById(
        "yesCount"
    ).textContent =
        yes;


    document.getElementById(
        "noCount"
    ).textContent =
        no;


    document.getElementById(
        "naCount"
    ).textContent =
        na;


    document.getElementById(
        "complianceRate"
    ).textContent =
        compliance + "%";


    document.getElementById(
        "progressText"
    ).textContent =
        completion + "%";


    document.getElementById(
        "progressLabel"
    ).textContent =
        total
            ? `تم تقييم ${answered} من ${total} بند`
            : "اكتمال بنود الجولة";


    document.getElementById(
        "progressFill"
    ).style.width =
        completion + "%";

}


/* =========================================================
   ROUND ID
========================================================= */

function generateRoundId(){

    const now =
        new Date();


    const date =
        now.getFullYear() +
        String(
            now.getMonth()+1
        ).padStart(
            2,
            "0"
        ) +
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    const random =
        Math.floor(
            1000 +
            Math.random() *
            9000
        );


    return (
        "MWR-" +
        date +
        "-" +
        random
    );

}


/* =========================================================
   ALERT
========================================================= */

function showAlert(
    message,
    type
){

    const box =
        document.getElementById(
            "formAlert"
        );


    box.className =
        "mobile-alert active " +
        (
            type ||
            "error"
        );


    box.innerHTML =
        message;


    box.scrollIntoView({

        behavior:"smooth",

        block:"center"

    });

}


/* =========================================================
   SUBMIT
========================================================= */

async function submitInspection(){

    const employeeSelect =
        document.getElementById(
            "employeeName"
        );


    const employeeNumber =
        document.getElementById(
            "employeeNumber"
        ).value.trim();


    const selectedEmployee =
        employees.find(
            function(item){

                return (
                    String(
                        item.employeeNumber ||
                        item.employeeName
                    ) ===
                    String(
                        employeeSelect.value
                    )
                );

            }
        );


    const employeeName =
        selectedEmployee
            ? selectedEmployee.employeeName
            : "";


    const date =
        document.getElementById(
            "inspectionDate"
        ).value;


    const time =
        document.getElementById(
            "inspectionTime"
        ).value;


    if(
        !employeeName ||
        !employeeNumber ||
        !date
    ){

        showAlert(
            "يرجى استكمال بيانات الجولة الأساسية.",
            "error"
        );

        return;

    }


    if(
        !selectedEmployee ||
        !selectedEmployee.signature
    ){

        showAlert(
            "لا يوجد توقيع إلكتروني مسجل لهذا الموظف.",
            "error"
        );

        return;

    }


    if(
        !currentItems.length
    ){

        showAlert(
            "لا توجد بنود مفعلة لهذه الجولة.",
            "error"
        );

        return;

    }


    const unanswered =
        currentItems.filter(
            function(item){

                return !item.status;

            }
        );


    if(
        unanswered.length
    ){

        showAlert(
            "يرجى تقييم جميع البنود. بقي " +
            unanswered.length +
            " بند بدون تقييم.",
            "error"
        );

        return;

    }


    const missingNotes =
        currentItems.filter(
            function(item){

                return (
                    item.status === "no" &&
                    !item.note
                );

            }
        );


    if(
        missingNotes.length
    ){

        showAlert(
            "كل بند تم اختياره «لا يطبق» يجب كتابة الملاحظة الخاصة به.",
            "error"
        );

        return;

    }


    const yes =
        currentItems.filter(
            function(item){

                return (
                    item.status === "yes"
                );

            }
        ).length;


    const no =
        currentItems.filter(
            function(item){

                return (
                    item.status === "no"
                );

            }
        ).length;


    const na =
        currentItems.filter(
            function(item){

                return (
                    item.status === "na"
                );

            }
        ).length;


    const applicable =
        yes + no;


    const complianceRate =
        applicable
            ? Math.round(
                yes /
                applicable *
                100
            )
            : 0;


    const record = {

        id:
            generateRoundId(),

        roundType:
            "medicalWaste",

        category:
            "medicalWaste",

        categoryName:
            "جولات النفايات الطبية",

        employeeName:
            employeeName,

        employeeNumber:
            employeeNumber,

        locationName:
            "النفايات الطبية",

        inspectionDate:
            date,

        inspectionTime:
            time,

        items:
            currentItems.map(
                function(item){

                    return {

                        id:
                            item.id,

                        sectionId:
                            item.sectionId,

                        sectionName:
                            item.sectionName,

                        text:
                            item.text,

                        status:
                            item.status,

                        note:
                            item.note

                    };

                }
            ),

        totalItems:
            currentItems.length,

        yesCount:
            yes,

        noCount:
            no,

        notApplicableCount:
            na,

        complianceRate:
            complianceRate,

        generalNotes:
            document.getElementById(
                "generalNotes"
            ).value.trim(),

        status:
            "submitted",

        createdAt:
            new Date()
            .toISOString()

    };


    const saved =
        await saveRecord(
            record
        );


    if(!saved){

        showAlert(
            "⚠️ تم حفظ الجولة محلياً، لكن تعذر إرسالها إلى قاعدة البيانات المركزية. تحقق من الاتصال ثم حاول مرة أخرى.",
            "error"
        );

        return;

    }


    showAlert(
        "✅ تم إرسال جولة النفايات الطبية بنجاح.<br>" +
        "تم حفظ الجولة في النظام المركزي.<br>" +
        "رقم الجولة: <strong>" +
        record.id +
        "</strong>",
        "success"
    );


    setTimeout(
        function(){

            window.location.href =
                "portal.html";

        },
        1800
    );

}


/* =========================================================
   SAVE
========================================================= */

async function saveRecord(record){

    let records = [];


    try{

        records =
            JSON.parse(
                localStorage.getItem(
                    RECORDS_KEY
                )
            ) || [];


        if(
            !Array.isArray(
                records
            )
        ){

            records = [];

        }

    }
    catch(error){

        records = [];

    }


    records.unshift(
        record
    );


    try{

        localStorage.setItem(
            RECORDS_KEY,
            JSON.stringify(
                records
            )
        );

    }
    catch(error){

        console.error(
            "Local waste save error:",
            error
        );

    }


    try{

        const {
            error
        } = await supabaseClient
            .from(
                "inspection_records"
            )
            .insert([
                {

                    round_id:
                        String(
                            record.id || ""
                        ),

                    round_type:
                        "medicalWaste",

                    record_data:
                        record

                }
            ]);


        if(error){

            console.error(
                "Supabase waste save error:",
                error
            );


            return false;

        }


        console.log(
            "☁️ Medical waste round saved:",
            record.id
        );


        return true;

    }
    catch(error){

        console.error(
            "Supabase waste connection error:",
            error
        );


        return false;

    }

}


/* =========================================================
   CANCEL
========================================================= */

function cancelInspection(){

    const confirmed =
        confirm(
            "هل تريد إلغاء الجولة؟ سيتم فقدان البيانات غير المحفوظة."
        );


    if(!confirmed){

        return;

    }


    window.location.href =
        "portal.html";

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(
        value || ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}

</script>
